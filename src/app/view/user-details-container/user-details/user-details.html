<div class="user-details-container" *ngIf="user">

  <!-- HEADER -->
  <div class="header">

    <div class="title">
      {{ user.name }}
    </div>

    <!-- ✅ SINGLE CLOSE BUTTON -->
    <button class="close-btn" (click)="closeSidenav()">
      <mat-icon>close</mat-icon>
    </button>

  </div>

  <!-- USER INFO -->
  <div class="info">

    <div class="info-row">
      <span>ID</span>
      <span>{{ user.id }}</span>
    </div>

    <div class="info-row">
      <span>Email</span>
      <span>{{ user.email }}</span>
    </div>

    <div class="info-row">
      <span>Role</span>
      <span>{{ user.role }}</span>
    </div>

  </div>

</div>

<div class="no-user" *ngIf="!user">
  Select a user to view details
</div>
