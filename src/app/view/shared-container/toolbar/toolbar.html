<mat-toolbar class="custom-toolbar">
  <span class="brand">Bezohminds</span>
  <span class="spacer"></span>

  <button mat-icon-button class="toolbar-icon">
    <mat-icon>notifications</mat-icon>
  </button>

  <!-- 🔑 ADD TEMPLATE REF HERE -->
  <button
    mat-icon-button
    class="toolbar-icon"
    [matMenuTriggerFor]="profileMenu"
    #menuTrigger="matMenuTrigger"
  >
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu
    #profileMenu="matMenu"
    class="profile-menu"
    xPosition="before"
  >
    <!-- ✅ PASS TRIGGER, NOT MENU -->
    <button
      mat-menu-item
      type="button"
      (click)="goToProfile(menuTrigger)"
    >
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>

    <mat-divider></mat-divider>

    <button
      mat-menu-item
      class="logout"
      type="button"
      (click)="logout()"
    >
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
