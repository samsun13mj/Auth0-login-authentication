<mat-toolbar class="custom-toolbar">
  <span class="brand">Bezohminds</span>
  <span class="spacer"></span>

  <!-- 🔔 NOTIFICATION BELL -->
  <button
    mat-icon-button
    class="notification-btn"
    [matMenuTriggerFor]="notificationMenu">

    <mat-icon>notifications</mat-icon>

    @if (unreadCount > 0) {
      <span class="badge">{{ unreadCount }}</span>
    }
  </button>

  <!-- 🔔 NOTIFICATION MENU -->
  <mat-menu #notificationMenu="matMenu" class="notification-menu">

    @if (notifications.length === 0) {
      <div class="empty">No notifications</div>
    }

    @for (n of notifications; track n.id) {
      <button mat-menu-item (click)="openNotification(n)">
        <span class="dot" [class.unread]="!n.read"></span>
        {{ n.message }}
      </button>
    }

    <mat-divider></mat-divider>

    <button mat-menu-item routerLink="/app/notifications">
      View all notifications
    </button>
  </mat-menu>

  <!-- 👤 PROFILE -->
  <button
    mat-icon-button
    [matMenuTriggerFor]="profileMenu">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #profileMenu="matMenu">
    <button mat-menu-item routerLink="/app/profile">
      <mat-icon>person</mat-icon>
      Profile
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </mat-menu>
</mat-toolbar>
