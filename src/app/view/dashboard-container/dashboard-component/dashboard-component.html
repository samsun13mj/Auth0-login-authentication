<mat-card class="table-card">

  <!-- HEADER -->
  <div class="table-header">

    <h2>Dashboard</h2>

    <div class="header-actions">

      <!-- 🚀 Modern Clean Search Bar -->
      <div class="search-box" [class.active]="showSearch">

        <!-- Search Icon -->
        <mat-icon class="search-icon" (click)="toggleSearch()">search</mat-icon>

        <input
          type="text"
          placeholder="Search users..."
          (keyup)="applyFilter($event)"
        />

        <!-- Close Icon -->
        <mat-icon class="close-icon" (click)="toggleSearch()">close</mat-icon>

      </div>

    </div>

  </div>

  <!-- LOADER -->
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <!-- TABLE + PAGINATOR -->
  <div [hidden]="loading">

    <table mat-table [dataSource]="dataSource" class="user-table">

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let user">{{ user.id }}</td>
      </ng-container>

      <!-- NAME -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <!-- EMAIL -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <!-- ROLE -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let user">{{ user.role }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="user-row"
        (click)="openUserDetails(row)">
      </tr>

    </table>

    <mat-paginator
      class="pageselect"
      [pageSize]="10"
      [pageSizeOptions]="[10, 20]"
      showFirstLastButtons>
    </mat-paginator>

  </div>

</mat-card>
